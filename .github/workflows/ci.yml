name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: gofmt + build (macOS, cgo/WKWebView)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: go vet
        run: go vet ./...

      - name: go test
        run: CGO_ENABLED=1 go test ./... -count=1

      - name: Build
        run: CGO_ENABLED=1 go build -o weft-app-osx .
